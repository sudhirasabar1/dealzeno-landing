<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dealzeno - Best Deal</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="header">
    <div class="logo">DEALZENO</div>
</header>

<main class="container">

    <section class="product-card">

        <div class="product-image">
            <img
                src="https://placehold.co/600x600/f5f5f5/111?text=PRODUCT"
                alt="Product"
            >
        </div>

        <div class="product-info">

            <span class="badge">🔥 LIMITED DEAL</span>

            <h1>Premium Product Deal</h1>

            <div class="price">
                <span class="current-price">₹298</span>
                <span class="old-price">₹799</span>
            </div>

            <p class="description">
                Grab this amazing deal today. Check the product details
                and get the best available offer.
            </p>

            <div class="buttons">

                <a
                    id="adButton"
                    class="btn btn-ad"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                >
                    🔗 Continue
                </a>

                <a
                    id="productLink"
                    class="btn btn-product"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                >
                    🛒 Buy Product
                </a>

                <a
                    id="telegramLink"
                    class="btn btn-telegram"
                    target="_blank"
                    rel="noopener"
                >
                    📲 Join Telegram
                </a>

            </div>

            <p class="ad-label">Advertisement</p>

        </div>

    </section>

</main>

<footer>
    © 2026 DEALZENO
</footer>

<script src="./script.js"></script>

</body>
</html>
