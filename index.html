<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dealzeno - Best Deal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">DEALZENO</div>
    </header>

    <main class="container">

        <section class="product-card">

            <div class="product-image">
                <img src="https://via.placeholder.com/500x500?text=Product"
                     alt="Product">
            </div>

            <div class="product-info">

                <span class="badge">LIMITED DEAL</span>

                <h1>Premium Product Deal</h1>

                <div class="price">
                    <span class="current-price">₹298</span>
                    <span class="old-price">₹799</span>
                </div>

                <p class="description">
                    Check out this amazing deal before it goes away.
                </p>

                <!-- Advertisement button -->
                <a
                    class="ad-button"
                    href="https://omg10.com/4/11706929"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                >
                    Continue to Advertisement →
                </a>

                <p class="ad-label">
                    Advertisement
                </p>

                <!-- Product button -->
                <a
                    class="product-button"
                    href="#"
                    id="productLink"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                >
                    View Product →
                </a>

                <p class="secure-text">
                    🔒 You will be redirected to the product page
                </p>

            </div>

        </section>

    </main>

    <footer>
        © 2026 DEALZENO
    </footer>

    <script src="script.js"></script>

</body>
</html>
